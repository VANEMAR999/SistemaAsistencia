<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Asistencia RENOVA</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .contenedor {
            max-width: 400px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,.15);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        p {
            line-height: 1.5;
        }

        input,
        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background: #222;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #444;
        }

        .botones-tipo { display:flex; gap:10px; margin-top:10px; }
        .botones-tipo button { flex:1; margin-top:0; }
        .btn-entrada { background:#188038; }
        .btn-salida { background:#c5221f; }
        .btn-entrada:hover { background:#126b2d; }
        .btn-salida:hover { background:#a61b19; }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        video {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
            background: black;
        }

        canvas {
            display: none;
        }

        .empleado-info {
            background: #f0f7f0;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .empleado-info h3 {
            margin-top: 0;
        }

        .exito {
            background: #dff5df;
            color: #176b17;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .error {
            background: #ffe1e1;
            color: #a00000;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .cargando {
            text-align: center;
            margin-top: 15px;
            padding: 15px;
        }

        .separador {
            margin-top: 20px;
        }

        /* ===== DISEÑO RENOVA ===== */

        :root {
            --renova-dark: #17212b;
            --renova-green: #188038;
            --renova-green-dark: #126b2d;
            --renova-red: #c5221f;
            --renova-text: #17212b;
            --renova-muted: #6b7280;
            --renova-border: #dfe4e8;
            --renova-bg: #eef2f5;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 10%, rgba(24,128,56,.10), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(23,33,43,.10), transparent 30%),
                var(--renova-bg);
            padding: 24px;
            color: var(--renova-text);
        }

        .contenedor {
            width: min(100%, 1100px);
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(255,255,255,.97);
            padding: 0 32px 24px;
            border-radius: 24px;
            box-shadow: 0 18px 50px rgba(23,33,43,.16);
            border: 1px solid rgba(255,255,255,.9);
            overflow: hidden;
        }

        .encabezado {
            margin: 0 -32px 28px;
            padding: 18px 26px;
            background: linear-gradient(135deg, #17212b, #263542);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .marca {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-renova {
            width: 58px;
            height: 58px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: white;
            overflow: hidden;
            box-shadow: 0 5px 14px rgba(0,0,0,.18);
            flex: 0 0 58px;
        }

        .logo-renova img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .nombre-marca {
            font-weight: 800;
            font-size: 15px;
            letter-spacing: .4px;
        }

        .submarca {
            margin-top: 3px;
            color: #cbd5dc;
            font-size: 12px;
        }

        .estado {
            white-space: nowrap;
            font-size: 11px;
            color: #d9e5dc;
            background: rgba(255,255,255,.10);
            padding: 7px 10px;
            border-radius: 999px;
        }

        .punto {
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 5px;
            border-radius: 50%;
            background: #57d477;
            box-shadow: 0 0 8px rgba(87,212,119,.8);
        }

        .titulo-principal {
            text-align: center;
            margin-bottom: 25px;
        }

        .titulo-principal h1 {
            font-size: 29px;
            margin: 0 0 8px;
            color: var(--renova-dark);
            letter-spacing: -.7px;
        }

        .titulo-principal p {
            margin: 0;
            color: var(--renova-muted);
            font-size: 14px;
        }

        .seccion-formulario label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #374151;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            pointer-events: none;
        }

        input,
        button {
            font-family: inherit;
        }

        input {
            width: 100%;
            height: 54px;
            padding: 13px 15px 13px 45px;
            margin-top: 0;
            border-radius: 12px;
            border: 1px solid var(--renova-border);
            background: #fafbfc;
            font-size: 17px;
            color: var(--renova-text);
            outline: none;
            transition: .2s ease;
            text-transform: uppercase;
        }

        input:focus {
            border-color: var(--renova-green);
            background: white;
            box-shadow: 0 0 0 4px rgba(24,128,56,.10);
        }

        input::placeholder {
            color: #9aa3ab;
            text-transform: none;
        }

        #btnContinuar {
            height: 54px;
            margin-top: 12px;
            border-radius: 12px;
            background: var(--renova-dark);
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 7px 16px rgba(23,33,43,.18);
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
        }

        #btnContinuar:hover {
            background: #243442;
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(23,33,43,.20);
        }

        .botones-tipo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 13px;
        }

        .botones-tipo button {
            min-height: 72px;
            margin-top: 0;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            border: 0;
            box-shadow: 0 7px 16px rgba(0,0,0,.10);
            transition: transform .15s ease, filter .15s ease;
        }

        .botones-tipo button:hover {
            transform: translateY(-2px);
            filter: brightness(1.04);
        }

        .btn-entrada {
            background: linear-gradient(135deg, #188038, #229447);
        }

        .btn-salida {
            background: linear-gradient(135deg, #c5221f, #d8322f);
        }

        .empleado-info {
            background: linear-gradient(135deg, #f1faf3, #f8fcf9);
            padding: 18px;
            border-radius: 15px;
            margin-top: 20px;
            border: 1px solid #d6eadb;
        }

        .empleado-info h3 {
            margin: 0 0 12px;
            color: var(--renova-green-dark);
            font-size: 18px;
        }

        .empleado-info p {
            margin: 7px 0;
        }

        video {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            margin-top: 18px;
            border-radius: 16px;
            background: #111;
            border: 4px solid #f0f2f3;
            box-shadow: 0 8px 22px rgba(0,0,0,.14);
        }

        #btnFoto {
            height: 54px;
            border-radius: 12px;
            background: var(--renova-dark);
            font-weight: 700;
            margin-top: 12px;
            box-shadow: 0 7px 16px rgba(23,33,43,.18);
        }

        #btnFoto:hover {
            background: #263746;
        }

        .exito,
        .error {
            padding: 20px;
            border-radius: 16px;
            margin-top: 20px;
            border: 1px solid;
        }

        .exito {
            background: #effaf2;
            color: #176b17;
            border-color: #cce8d2;
        }

        .exito h3 {
            margin-top: 0;
            font-size: 21px;
        }

        .error {
            background: #fff3f3;
            color: #a00000;
            border-color: #f1cccc;
        }

        .cargando {
            text-align: center;
            margin-top: 18px;
            padding: 14px;
            color: var(--renova-muted);
        }

        #resultado > p {
            margin-top: 22px;
            margin-bottom: 8px;
        }

        .pie {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin-top: 25px;
            color: #9aa3ab;
            font-size: 11px;
        }

        button:active {
            transform: scale(.99);
        }

        /* ===== ACCESO ADMINISTRATIVO ===== */
        .admin-acceso {
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid var(--renova-border);
            text-align: center;
        }
        .btn-admin {
            width: auto;
            display: inline-block;
            margin: 0;
            padding: 11px 18px;
            border-radius: 10px;
            background: #f4f6f8;
            color: var(--renova-dark);
            border: 1px solid var(--renova-border);
            font-size: 13px;
            font-weight: 700;
        }
        .btn-admin:hover { background: #e9edf0; }
        .admin-acciones { display:flex; gap:8px; }
        .btn-cerrar-admin {
            width:auto; margin:0; padding:10px 14px; border-radius:10px;
            background:#7b8791; font-size:13px; font-weight:700;
        }

        /* ===== REGISTROS ===== */
        .registros-panel {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--renova-border);
        }
        .registros-titulo {
            display:flex; align-items:center; justify-content:space-between; gap:12px;
            margin-bottom:16px;
        }
        .registros-titulo h2 { margin:0; font-size:22px; color:var(--renova-dark); }
        .btn-actualizar {
            width:auto; margin:0; padding:10px 14px; border-radius:10px;
            background:var(--renova-dark); font-size:13px; font-weight:700;
        }
        .filtros-registros {
            display:grid; grid-template-columns:1fr 1fr auto; gap:10px; margin-bottom:14px;
        }
        .filtros-registros input, .filtros-registros select {
            height:46px; padding:8px 12px; border:1px solid var(--renova-border);
            border-radius:10px; background:#fafbfc; font-family:inherit; font-size:14px;
        }
        .tabla-wrap { overflow-x:auto; border:1px solid var(--renova-border); border-radius:12px; }
        .tabla-registros { width:100%; border-collapse:collapse; min-width:650px; background:white; }
        .tabla-registros th { background:#f4f6f8; color:#4b5563; font-size:12px; text-transform:uppercase; padding:11px 10px; text-align:left; }
        .tabla-registros td { padding:11px 10px; border-top:1px solid #edf0f2; font-size:13px; }
        .badge-entrada, .badge-salida { display:inline-block; padding:5px 9px; border-radius:999px; font-weight:700; font-size:12px; }
        .badge-entrada { background:#e9f7ed; color:#176b17; }
        .badge-salida { background:#fff0f0; color:#a00000; }
        .btn-foto-registro { width:auto; margin:0; padding:7px 10px; border-radius:8px; background:#eef2f5; color:var(--renova-dark); font-size:12px; font-weight:700; }
        .sin-registros { text-align:center; padding:24px; color:var(--renova-muted); }
        .contador-registros { color:var(--renova-muted); font-size:12px; margin:8px 0 0; }

        @media (max-width: 520px) {
            body {
                padding: 12px;
                align-items: flex-start;
            }

            .contenedor {
                margin: 10px auto;
                padding: 0 20px 20px;
                border-radius: 20px;
            }

            .encabezado {
                margin: 0 -20px 24px;
                padding: 16px 18px;
            }

            .estado {
                display: none;
            }

            .titulo-principal h1 {
                font-size: 25px;
            }

            .botones-tipo { gap: 8px; }

            .filtros-registros { grid-template-columns: 1fr; }
            .registros-titulo { align-items:flex-start; flex-direction:column; }
            .btn-actualizar, .btn-cerrar-admin { width:100%; }
            .admin-acciones { width:100%; flex-direction:column; }

            .botones-tipo button {
                font-size: 15px;
            }
        }

    
        /* Cámara frontal: vista previa sin efecto espejo */
        video {
            aspect-ratio: 3 / 4 !important;
            object-fit: cover !important;
            transform: scaleX(-1) !important;
            -webkit-transform: scaleX(-1) !important;
        }

    </style>

</head>

// =====================================================
// BUSCAR EMPLEADO
// =====================================================

async function buscarEmpleado() {

    const input =
        document.getElementById("empleado");

    const boton =
        document.getElementById("btnContinuar");

    const resultado =
        document.getElementById("resultado");


    const empleado =
        input.value.trim().toUpperCase();


    // Verificar que escribió algo

    if (empleado === "") {

        alert("Ingresa tu código de empleado");

        input.focus();

        return;
    }


    // Desactivar botón mientras busca

    boton.disabled = true;


    resultado.innerHTML =
        "<div class='cargando'>🔎 Buscando empleado...</div>";


    try {

        // Buscar en Supabase

        const { data, error } =

            await supabaseClient

                .from("empleados")

                .select(
                    "id, nombre, activo"
                )

                .eq(
                    "id",
                    empleado
                )

                .maybeSingle();


        // Error de Supabase

        if (error) {

            console.error(
                "Error Supabase:",
                error
            );

            resultado.innerHTML =

                "<div class='error'>" +

                "<strong>❌ Error al consultar.</strong>" +

                "<br><br>" +

                error.message +

                "</div>";

            boton.disabled = false;

            return;
        }


        // Empleado no encontrado

        if (!data) {

            resultado.innerHTML =

                "<div class='error'>" +

                "<strong>❌ Empleado no encontrado.</strong>" +

                "<br><br>" +

                "Verifica el número de empleado." +

                "</div>";

            boton.disabled = false;

            return;
        }


        // Empleado inactivo

        if (data.activo !== true) {

            resultado.innerHTML =

                "<div class='error'>" +

                "<strong>❌ Empleado inactivo.</strong>" +

                "<br><br>" +

                "No es posible registrar la asistencia." +

                "</div>";

            boton.disabled = false;

            return;
        }


        // Guardar empleado actual

        empleadoActual = data;


        // Mostrar usuario encontrado.
        // La cámara todavía NO se abre: primero debe seleccionar Entrada o Salida.

        resultado.innerHTML =

            "<div class='empleado-info'>" +

            "<h3>✅ Usuario encontrado</h3>" +

            "<p>" +

            "<strong>Usuario:</strong> " +

            escaparHTML(data.id) +

            "</p>" +

            "<p>" +

            "<strong>Nombre:</strong> " +

            escaparHTML(data.nombre) +

            "</p>" +

            "</div>" +

            "<p><strong>¿Qué deseas registrar?</strong></p>" +

            "<div class='botones-tipo'>" +
            "<button class='btn-entrada' onclick='seleccionarTipo(\"Entrada\")'>🟢 Entrada</button>" +
            "<button class='btn-salida' onclick='seleccionarTipo(\"Salida\")'>🔴 Salida</button>" +
            "</div>" +

            "<div id='accionesRegistro'></div>";


    } catch (error) {

        console.error(error);

        resultado.innerHTML =

            "<div class='error'>" +

            "❌ Ocurrió un error inesperado." +

            "</div>";

        boton.disabled = false;
    }

}


// =====================================================
// INICIAR CÁMARA
// =====================================================

async function iniciarCamara() {

    const video =
        document.getElementById("video");


    if (!video) {
        return;
    }


    try {

        // Solicitar cámara

        streamActual =

            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {
                        facingMode: "user"
                    },

                    audio: false

                });


        // Mostrar cámara sin efecto espejo.
        // La inversión es SOLO visual; la foto capturada desde el
        // stream se guarda sin espejo.
        video.srcObject = streamActual;
        video.style.transform = "scaleX(-1)";
        video.style.webkitTransform = "scaleX(-1)";


    } catch (error) {

        console.error(
            "Error cámara:",
            error
        );


        document.getElementById(
            "resultado"
        ).innerHTML +=

            "<div class='error'>" +

            "<strong>❌ No se pudo abrir la cámara.</strong>" +

            "<br><br>" +

            "Debes permitir el acceso a la cámara " +

            "para registrar la asistencia." +

            "</div>";

    }

}


// =====================================================
// SELECCIONAR TIPO DE REGISTRO
// =====================================================

function seleccionarTipo(tipo) {

    tipoRegistro = tipo;

    const acciones = document.getElementById("accionesRegistro");

    if (!acciones) {
        console.error("No existe accionesRegistro");
        return;
    }

    acciones.innerHTML =
        "<div class='cargando'>" +
        "Registro seleccionado: <strong>" +
        escaparHTML(tipo) +
        "</strong>" +
        "</div>" +

        "<video id='video' autoplay playsinline></video>" +
        "<canvas id='canvas'></canvas>" +

        "<button id='btnFoto' onclick='tomarFoto()'>" +
        "📸 Tomar fotografía" +
        "</button>";

    // La cámara se inicia DESPUÉS de elegir Entrada/Salida.
    iniciarCamara();
}

// =====================================================
// DETENER CÁMARA
// =====================================================

function detenerCamara() {

    if (streamActual) {

        streamActual
            .getTracks()
            .forEach(
                track => track.stop()
            );

        streamActual = null;
    }

}


// =====================================================
// NUEVO REGISTRO
// =====================================================

function nuevoRegistro() {

    detenerCamara();


    empleadoActual = null;

    tipoRegistro = null;


    document.getElementById(
        "resultado"
    ).innerHTML = "";


    document.getElementById(
        "empleado"
    ).value = "";


    document.getElementById(
        "btnContinuar"
    ).disabled = false;


    document.getElementById(
        "empleado"
    ).focus();

}

const CLAVE_ADMIN = "RENOVA2026";
let accesoAdmin = false;

function abrirAccesoAdmin() {

    if (clave === null) return;

    if (clave !== CLAVE_ADMIN) {
        alert("❌ Clave incorrecta.");

    }

}

function cerrarAdmin() {
    accesoAdmin = false;
    document.getElementById("registrosPanel").style.display = "none";
    document.getElementById("filtroEmpleado").value = "";
    document.getElementById("filtroTipo").value = "";
    registrosCargados = [];
}

// =====================================================
// REGISTROS DE ASISTENCIA
// =====================================================

let registrosCargados = [];

function fechaLocalISO() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
}

async function cargarRegistros() {
    if (!accesoAdmin) return;

    const fechaInput = document.getElementById("filtroFecha");
    const fecha = fechaInput.value || fechaLocalISO();
    fechaInput.value = fecha;

    const body = document.getElementById("tablaRegistrosBody");
    const contador = document.getElementById("contadorRegistros");
    body.innerHTML = "<tr><td colspan='6' class='sin-registros'>⏳ Cargando registros...</td></tr>";

    // Convertimos los límites de la fecha local a ISO/UTC porque
    // fecha_hora en Supabase es timestamptz. Esto evita que se oculten
    // registros por la diferencia de zona horaria (México/UTC).
    const inicioLocal = new Date(`${fecha}T00:00:00`);
    const finLocal = new Date(`${fecha}T00:00:00`);
    finLocal.setDate(finLocal.getDate()+1);

    const inicio = inicioLocal.toISOString();
    const fin = finLocal.toISOString();

    const { data, error } = await supabaseClient
        .from("asistencia")
        .select("id, empleado_id, tipo, fecha_hora, foto_url")
        .gte("fecha_hora", inicio)
        .lt("fecha_hora", fin)
        .order("fecha_hora", { ascending:false });

    if (error) {
        console.error("Error al cargar registros:", error);
        body.innerHTML = `<tr><td colspan="6" class="sin-registros">❌ No se pudieron consultar los registros.<br><small>${escaparHTML(error.message)}</small></td></tr>`;
        contador.textContent = "Error al consultar";
        return;
    }

    registrosCargados = data || [];

    // Obtener nombres sin depender de una relación de Supabase.
    if (registrosCargados.length) {
        const ids = [...new Set(registrosCargados.map(r => r.empleado_id))];
        const { data: empleadosData } = await supabaseClient
            .from("empleados")
            .select("id, nombre")
            .in("id", ids);
        const nombres = Object.fromEntries((empleadosData || []).map(e => [e.id, e.nombre]));
        registrosCargados = registrosCargados.map(r => ({...r, nombre: nombres[r.empleado_id] || "—"}));
    }

    contador.textContent = `${registrosCargados.length} registro${registrosCargados.length === 1 ? "" : "s"} encontrado${registrosCargados.length === 1 ? "" : "s"}`;
    filtrarTabla();
}

function filtrarTabla() {
    const texto = (document.getElementById("filtroEmpleado")?.value || "").trim().toUpperCase();
    const tipo = document.getElementById("filtroTipo")?.value || "";
    const body = document.getElementById("tablaRegistrosBody");

    const lista = registrosCargados.filter(r => {
        const coincideEmpleado = !texto || String(r.empleado_id).toUpperCase().includes(texto) || String(r.nombre).toUpperCase().includes(texto);
        const coincideTipo = !tipo || r.tipo === tipo;
        return coincideEmpleado && coincideTipo;
    });

    if (!lista.length) {
        body.innerHTML = "<tr><td colspan='6' class='sin-registros'>No hay registros que coincidan con los filtros.</td></tr>";
        return;
    }

    body.innerHTML = lista.map(r => {
        const d = new Date(r.fecha_hora);
        const fecha = d.toLocaleDateString("es-MX");
        const hora = d.toLocaleTimeString("es-MX", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
        const badge = r.tipo === "Entrada" ? "badge-entrada" : "badge-salida";
        const foto = r.foto_url ? `<button class="btn-foto-registro" onclick="verFoto('${encodeURIComponent(r.foto_url)}')">📷 Ver</button>` : "—";
        return `<tr>
            <td><strong>${escaparHTML(r.empleado_id)}</strong></td>
            <td>${escaparHTML(r.nombre)}</td>
            <td><span class="${badge}">${escaparHTML(r.tipo)}</span></td>
            <td>${fecha}</td>
            <td>${hora}</td>
            <td>${foto}</td>
        </tr>`;
    }).join("");
}

function verFoto(urlCodificada) {
    const url = decodeURIComponent(urlCodificada);
    window.open(url, "_blank", "noopener,noreferrer");
}

// =====================================================
// SEGURIDAD PARA MOSTRAR TEXTO
// =====================================================

function escaparHTML(texto) {

    return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

// ENTER PARA CONTINUAR
// =====================================================

document.getElementById(
    "empleado"
).addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            buscarEmpleado();

    }
